apply plugin: 'com.android.library'


dependencies {
    compileOnly 'com.android.support:support-annotations:20.0.0'

    implementation project(':lib-core')
    implementation 'com.nineoldandroids:library:2.4.0'
    /* Test libraries */
    androidTestImplementation ('org.mockito:mockito-core:1.9.5')  { exclude group: 'org.hamcrest' }
    androidTestImplementation ('junit:junit:4.11')  { exclude group: 'org.hamcrest' }
    androidTestImplementation 'org.hamcrest:hamcrest-all:1.3'
    androidTestImplementation files('libs/dexmaker-1.1.jar')
    androidTestImplementation files('libs/dexmaker-mockito-1.1-custom.jar')
}

android {
    compileSdkVersion 29
    buildToolsVersion '30.0.3'

    defaultConfig {
        minSdkVersion 19
        //noinspection OldTargetApi
        targetSdkVersion 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    packagingOptions {
        resources {
            excludes += ['LICENSE.txt']
        }
    }

    lint {
        textOutput file('stdout')
        textReport true
        warningsAsErrors true
    }
    namespace 'com.nhaarman.listviewanimations.itemmanipulation'

}

