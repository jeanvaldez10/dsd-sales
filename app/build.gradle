apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

repositories {
    google()
}

android {
    signingConfigs {
        debug {
            storeFile file('D:\\dsdvansales.jks')
            storePassword 'dkfwkfeoaud'
            keyAlias = 'dsdvansales'
            keyPassword 'dkfwkfeoaud'
        }
    }
    compileSdkVersion 34
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId "dsd.dsdvansales"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 8946
        versionName "8.9.46"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        applicationVariants.all { variant ->
            variant.outputs.all {
                def versionName = variant.versionName
                outputFileName = "DSDVanSales_v${versionName}.apk"
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['com/itextpdf/text/pdf/fonts/cmap_info.txt']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace 'dsd.dsdvansales'

    /*dexOptions {
        preDexLibraries = false
        javaMaxHeapSize "4096M"
    }*/
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    implementation 'com.google.android.gms:play-services-location:17.1.0'
    implementation 'com.google.android.gms:play-services-gcm:17.0.0'
    implementation 'com.google.android.play:app-update:2.0.1'

    implementation platform('com.google.firebase:firebase-bom:28.3.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.quickblox:quickblox-android-sdk-chat:3.5.2'
